name: Daily Kaapstays researched article
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-kaapstays-pseo
  cancel-in-progress: false
jobs:
  research-write-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research and generate one article
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
        run: python scripts/daily_pseo_content.py
      - name: Validate article registry
        run: python -m json.tool src/lib/generated-articles.json > /dev/null
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generated-articles.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish researched Kaapstays buyer guide"
          git push origin HEAD:main
