name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      # The connected Lovable workspace publishes changes from this branch.
      # Deploy it as well so the Pages site does not remain on an older,
      # potentially blank artifact while a pull request is awaiting merge.
      - work
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Configure the Pages deployment before creating the artifact. This keeps
      # the GitHub Pages environment and deployment metadata in sync when the
      # custom domain is proxied through Cloudflare.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        run: npm run build:pages

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test "$(tr -d '\r\n' < dist/CNAME)" = "kaapstays.co.za"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
