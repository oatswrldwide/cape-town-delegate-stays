name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      # The connected Lovable workspace publishes changes from this branch.
      # Deploy it as well so the Pages site does not remain on an older,
      # potentially blank artifact while a pull request is awaiting merge.
      - work
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily Kaapstays researched article
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Configure the Pages deployment before creating the artifact. This keeps
      # the GitHub Pages environment and deployment metadata in sync when the
      # custom domain is proxied through Cloudflare.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        run: npm run build:pages

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/insights/index.html
          test -f dist/insights/south-african-fruit-export-requirements-buyer-checklist/index.html
          test "$(tr -d '\r\n' < dist/CNAME)" = "kaapstays.co.za"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout article registry
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Email the newly published article
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ARTICLE_RECIPIENT: ongezile.mqokeli@gmail.com
        run: |
          python - <<'PY'
          import json, os, smtplib, ssl
          from email.message import EmailMessage
          from pathlib import Path

          articles = json.loads(Path("src/lib/generated-articles.json").read_text(encoding="utf-8"))
          if not articles:
              raise SystemExit("No published article found; email not sent.")

          username = os.environ.get("SMTP_USERNAME", "").strip()
          password = os.environ.get("SMTP_PASSWORD", "").replace(" ", "")
          if not username or not password:
              raise SystemExit("Missing SMTP_USERNAME or SMTP_PASSWORD repository secret.")
          if "@" not in username:
              raise SystemExit("SMTP_USERNAME must be the complete Gmail email address.")

          article = articles[-1]
          url = "https://kaapstays.co.za" + article["path"]
          msg = EmailMessage()
          msg["Subject"] = "New Kaapstays article: " + article["title"]
          msg["From"] = username
          msg["To"] = os.environ["ARTICLE_RECIPIENT"]
          msg.set_content(
              "Your new Kaapstays article has been published.\n\n"
              + article["title"] + "\n" + url + "\n\n"
              + article.get("description", "") + "\n\n"
              + "Open the article to read the full buyer guide."
          )

          # Gmail SMTP submission: smtp.gmail.com:587 with STARTTLS.
          # This is fixed deliberately so an incorrect SMTP_HOST/SMTP_PORT
          # secret cannot send the workflow to the wrong endpoint.
          context = ssl.create_default_context()
          try:
              with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as smtp:
                  smtp.ehlo()
                  smtp.starttls(context=context)
                  smtp.ehlo()
                  smtp.login(username, password)
                  smtp.send_message(msg)
          except smtplib.SMTPAuthenticationError as exc:
              raise SystemExit(
                  "Gmail rejected SMTP authentication. Confirm SMTP_USERNAME is the full Gmail address "
                  "and SMTP_PASSWORD is a current Google App Password (not the normal account password). "
                  f"SMTP response code: {exc.smtp_code}"
              )
          except (smtplib.SMTPException, OSError) as exc:
              raise SystemExit(
                  f"Gmail SMTP connection/send failed: {type(exc).__name__}: {exc}"
              )

          print("Article email sent to " + os.environ["ARTICLE_RECIPIENT"] + ": " + url)
          PY
