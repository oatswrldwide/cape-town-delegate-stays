name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      # The connected Lovable workspace publishes changes from this branch.
      # Deploy it as well so the Pages site does not remain on an older,
      # potentially blank artifact while a pull request is awaiting merge.
      - work
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily Kaapstays researched article
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Configure the Pages deployment before creating the artifact. This keeps
      # the GitHub Pages environment and deployment metadata in sync when the
      # custom domain is proxied through Cloudflare.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        run: npm run build:pages

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test "$(tr -d '\r\n' < dist/CNAME)" = "kaapstays.co.za"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Email the newly published article
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ARTICLE_RECIPIENT: ongezile.mqokeli@gmail.com
        run: |
          python - <<'PY'
          import json, os, smtplib
          from email.message import EmailMessage
          from pathlib import Path

          articles = json.loads(Path("src/lib/generated-articles.json").read_text(encoding="utf-8"))
          if not articles:
              raise SystemExit("No published article found; email not sent.")
          article = articles[-1]
          if not os.environ.get("GMAIL_ADDRESS") or not os.environ.get("GMAIL_APP_PASSWORD"):
              raise SystemExit("Missing GMAIL_ADDRESS or GMAIL_APP_PASSWORD repository secret.")

          url = "https://kaapstays.co.za" + article["path"]
          msg = EmailMessage()
          msg["Subject"] = "New Kaapstays article: " + article["title"]
          msg["From"] = os.environ["GMAIL_ADDRESS"]
          msg["To"] = os.environ["ARTICLE_RECIPIENT"]
          msg.set_content(
              "Your new Kaapstays article has been published.\\n\\n"
              + article["title"] + "\\n" + url + "\\n\\n"
              + article.get("description", "") + "\\n\\n"
              + "Open the article to read the full buyer guide."
          )
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(os.environ["GMAIL_ADDRESS"], os.environ["GMAIL_APP_PASSWORD"])
              smtp.send_message(msg)
          print("Article email sent to " + os.environ["ARTICLE_RECIPIENT"] + ": " + url)
          PY
